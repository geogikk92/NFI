name: CI

on:
  push:
    branches: [main]
  pull_request:

# Нов push по същия клон отменя предишния пробег — иначе се трупа опашка.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nfi
          POSTGRES_PASSWORD: nfi
          POSTGRES_DB: nfi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://nfi:nfi@localhost:5432/nfi_test
      # Тестовете на lib/legal четат реквизитите на продавача.
      SELLER_NAME: CI
      SELLER_EIK: "000000000"
      SELLER_ADDRESS: CI
      APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # postinstall вика `prisma generate`, така че клиентът идва наготово.
      - run: npm ci

      - name: Схемата валидна ли е
        run: npx prisma validate

      # Срещу истинска база — иначе тестът за паралелните номера на
      # фактури се пропуска тихо и никой не забелязва.
      - name: Миграции
        run: npx prisma migrate deploy

      - name: Сийд на тестовата база
        run: npm run db:seed

      - name: Типове
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Контраст (WCAG 2.1 AA)
        run: npm run a11y:contrast
        
      # Съдържанието по езици — празен блок на един език чупи страницата
      # само за тази публика и не се вижда при преглед на български.
      - name: Редактируеми текстове по езици
        run: npm run check:content

      # Само докладва. Преди деплой в продукция се пуска
      # `npm run check:legal:strict`, което спира пускането.
      - name: Незапълнени правни текстове
        run: npm run check:legal

      - name: Тестове
        run: npm test

      - name: Build
        run: npm run build
        
      # Само Chromium: axe дава един и същ резултат в трите двигателя,
      # а сваляне на трите утроява времето. Кросбраузър проверката
      # (`npm run verify:browsers`) се пуска преди пускане, не тук —
      # виж docs/ДОСТЪПНОСТ.md.
      - name: Браузър за проверката
        run: npx playwright install --with-deps chromium

      # Достъпността е ПРАВНО задължение (Директива (ЕС) 2019/882,
      # WCAG 2.1 AA) — затова спира билда, а не само докладва.
      # Иска построен сайт, затова е след Build.
      - name: Достъпност на страниците (axe-core)
        run: npm run a11y:pages
